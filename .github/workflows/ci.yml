name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Lint
        run: bun run lint

      - name: Check format
        run: bun run format:check

      - name: Lint medication data
        run: bun run lint:meds

      - name: Validate medication source and generated artifacts
        run: bun run validate:meds

      - name: Type check
        run: bun run type-check

      - name: Unit tests
        run: bun run test -- --ci --coverage=false

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}-chromium-webkit

      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max_attempts=3
            local delay=10
            local cmd_timeout="${CMD_TIMEOUT:-180}"
            while true; do
              if timeout --foreground "$cmd_timeout" "$@"; then
                return 0
              fi
              local status=$?
              # 124 = timeout(1) killed a hung command (typical for flaky apt)
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${max_attempts} attempts (last exit ${status}): $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max_attempts} failed (exit ${status}) for: $* — retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }
          # Download browsers only (no apt). Cache makes subsequent runs fast.
          CMD_TIMEOUT=300 retry bunx playwright install chromium webkit
          # OS deps use apt and can hang on archive.ubuntu.com — hard timeout + backoff.
          CMD_TIMEOUT=120 retry bunx playwright install-deps chromium webkit

      - name: Run Playwright tests
        run: bun run e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Configure Git authentication and identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish GitHub Pages
        run: bun run deploy

      - name: Verify public deployment
        run: bun run verify:deploy
        env:
          DEPLOY_URL: https://my-creations.github.io/dose-segura
          GITHUB_SHA: ${{ github.sha }}
