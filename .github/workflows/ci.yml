name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Lint
        run: bun run lint

      - name: Check format
        run: bun run format:check

      - name: Lint medication data
        run: bun run lint:meds

      - name: Validate medication source and generated artifacts
        run: bun run validate:meds

      - name: Type check
        run: bun run type-check

      - name: Unit tests
        run: bun run test -- --ci --coverage=false

  e2e:
    name: Playwright E2E
    needs: quality
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Official image ships browsers + OS deps — avoids flaky apt on archive.ubuntu.com.
    # Keep tag aligned with @playwright/test in bun.lock (currently 1.58.1).
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        # oven-sh/setup-bun needs unzip, which the Playwright image lacks; avoid apt.
        run: npm install -g bun@1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
          # Use browsers baked into the Playwright image.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Run Playwright tests
        run: bun run e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Configure Git authentication and identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish GitHub Pages
        run: bun run deploy

      - name: Verify public deployment
        run: bun run verify:deploy
        env:
          DEPLOY_URL: https://my-creations.github.io/dose-segura
          GITHUB_SHA: ${{ github.sha }}
